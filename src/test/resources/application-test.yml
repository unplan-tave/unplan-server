# 통합 테스트(@SpringBootTest @ActiveProfiles("test")) 전용 프로필.
# 외부 Postgres/.env 없이 인메모리 H2 로 전체 컨텍스트를 부팅한다.
spring:
  datasource:
    # NON_KEYWORDS=INTERVAL: recurrence_rule 의 interval 컬럼명은 H2 예약어라 그대로면 DDL 실패
    # (프로덕션 Postgres 에선 식별자로 허용됨). 테스트에서만 예약어 해제해 실제 스키마와 동일하게 사용.
    url: jdbc:h2:mem:unplan_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=INTERVAL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: false

# 실제 시크릿이 아닌 테스트용 더미 값 (컨텍스트 부팅에 필요한 @Value 충족)
jwt:
  secret: dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItdW5wbGFuLWludGVncmF0aW9uLXRlc3Rz
  access-expiration: 3600000
  refresh-expiration: 2592000000

google:
  client-id: test-google-client-id

swagger:
  server-url: http://localhost:8080
  description: Test Server
